name: Pruebas Automáticas Django

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Define la carpeta por defecto donde se ejecutarán los comandos
    defaults:
      run:
        working-directory: ./nuvempry

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './nuvempry/requirements.txt'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests de Django
        env:
          SECRET_KEY: 'clave-secreta-temporal-solo-para-tests'
          DEBUG: 'True'
        run: |
          python manage.py test